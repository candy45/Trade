<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>交易日志</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0b0d12; --bg2:#101318; --card:#151922; --card2:#1b2029;
  --line:#232936; --txt:#e8ecf3; --txt2:#98a1b2; --txt3:#6b7488;
  --gold:#d8a657; --gold-d:rgba(216,166,87,.14); --gold-l:rgba(216,166,87,.35);
  --red:#e5484d; --green:#2fa36b; --blue:#5b9dff;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.55;overscroll-behavior-y:none}
button{font-family:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer}
input,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:none;border:0;outline:none;width:100%}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:600px;margin:0 auto;position:relative;min-height:100dvh}

/* ---------- 通用 ---------- */
.view{display:none;min-height:100dvh}
.view.on{display:block}
.hdr{display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + var(--safe-t)) 18px 8px}
.brand{font-size:19px;font-weight:700;letter-spacing:.4px}
.brand small{font-size:11px;font-weight:400;color:var(--txt3);margin-left:7px;letter-spacing:0}
.acts{display:flex;gap:8px}
.ico{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center;
  font-size:15px;color:var(--txt2);transition:.15s}
.ico:active{background:var(--card2);transform:scale(.94)}

.card{background:var(--card);border-radius:14px;padding:14px 15px;margin:0 16px 12px}
.clabel{font-size:11.5px;color:var(--txt3);letter-spacing:.5px;margin-bottom:9px;
  display:flex;align-items:center;justify-content:space-between}
.clabel b{color:var(--gold);font-weight:500;font-size:11px;letter-spacing:0}
.hint{font-size:11.5px;color:var(--txt3);line-height:1.6}

/* ---------- 日历 ---------- */
.monbar{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px 4px}
.monbar .m{font-size:16.5px;font-weight:600;letter-spacing:.3px;min-width:118px;text-align:center}
.monbar button{width:32px;height:32px;border-radius:9px;color:var(--txt2);font-size:18px}
.monbar button:active{background:var(--card)}
.statline{padding:0 18px 10px;font-size:11.5px;color:var(--txt3);display:flex;gap:14px;justify-content:center}
.statline b{color:var(--gold);font-weight:600}
.wkhead{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;margin-bottom:4px}
.wkhead div{text-align:center;font-size:11px;color:var(--txt3);padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px}
.cell{height:46px;border-radius:9px;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;position:relative;transition:.12s}
.cell.pad{pointer-events:none}
.cell .n{font-size:13px;color:#7d8698;font-variant-numeric:tabular-nums}
.cell.has{background:#181d27}
.cell.has .n{color:var(--txt)}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cell.today .n{color:var(--gold);font-weight:600}
.cell:active{transform:scale(.93)}
.dots{display:flex;gap:3px;height:4px;align-items:center}
.dots i{width:4px;height:4px;border-radius:50%;display:block}
.d-pre{background:var(--gold)}
.d-post{background:var(--blue)}
.listhead{display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 18px 8px;font-size:12px;color:var(--txt3)}
.listhead span:last-child{color:var(--txt3)}
.entry{background:var(--card);border-radius:13px;margin:0 16px 9px;padding:12px 14px}
.entry:active{background:var(--card2)}
.e-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.e-date{font-size:13px;font-weight:600;letter-spacing:.2px}
.e-syms{font-size:10.5px;color:var(--gold);letter-spacing:.3px;max-width:52%;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-txt{font-size:12.5px;color:var(--txt2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;padding:2px 8px;border-radius:20px;background:#202633;color:#9aa4b6;letter-spacing:.2px}
.tag.gold{background:var(--gold-d);color:var(--gold)}
.tag.on{background:rgba(216,166,87,.085);color:#d3c0a0}
.empty{text-align:center;padding:44px 30px;color:var(--txt3);font-size:12.5px;line-height:1.9}
.empty .big{font-size:26px;display:block;margin-bottom:10px;opacity:.5}

/* ---------- 详情 ---------- */
#vDay{padding-bottom:40px}
.daybar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + var(--safe-t)) 12px 4px}
.daybar .back{width:38px;height:38px;display:grid;place-items:center;font-size:22px;color:var(--txt2)}
.daybar .mid{text-align:center;flex:1}
.daybar .dt{font-size:16px;font-weight:650;letter-spacing:.3px}
.daybar .sub{font-size:11px;color:var(--txt3);margin-top:1px}
.seg{display:flex;background:var(--card);border-radius:11px;padding:3px;margin:12px 16px 16px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13px;color:var(--txt3);transition:.18s}
.seg button.on{background:var(--card2);color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seg button.on.pre{color:var(--gold)}
.seg button.on.post{color:var(--blue)}
.pane{display:none}
.pane.on{display:block}
.symbar{display:flex;flex-wrap:wrap;gap:7px}
.sym{display:flex;align-items:center;gap:6px;background:#1e2530;border-radius:9px;
  padding:6px 9px;font-size:12.5px;color:#c3cad6;max-width:100%}
.sym .c{font-size:10px;color:var(--txt3)}
.sym .x{color:var(--txt3);font-size:14px;padding-left:2px;line-height:1}
.sym.plan{border:1px solid rgba(216,166,87,.28)}
.sym.extra{border:1px dashed rgba(91,157,255,.4)}
.symadd{display:flex;align-items:center;gap:5px;border-radius:9px;padding:6px 11px;
  font-size:12.5px;color:var(--gold);background:var(--gold-d);border:1px solid var(--gold-l)}
.symtag{font-size:9px;padding:0 4px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--txt3)}
textarea{background:transparent;resize:none;line-height:1.75;min-height:104px;
  font-size:15px;color:var(--txt);padding:0}
textarea::placeholder{color:#4d5566}
.fieldwrap{background:var(--card);border-radius:14px;padding:14px 15px;margin:0 16px 12px}
.savebar{text-align:center;font-size:10.5px;color:var(--txt3);padding:4px 0 18px;height:26px}
.savebar.act{color:var(--gold)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagrow .tag{position:relative}
.tag .del{margin-left:5px;color:#5d6577;font-size:11px;padding:0 1px}
.taginput{width:70px;background:#202633;border-radius:20px;padding:2px 8px;font-size:11px;
  color:var(--txt);display:none}
.taginput.on{display:block}

/* ---------- 弹层 ---------- */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:.22s;z-index:60;backdrop-filter:blur(2px)}
#mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#161b24;
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-b));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  max-width:600px;margin:0 auto;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:600}
.sheet .sub{font-size:11.5px;color:var(--txt3);margin-bottom:14px}
.sheet .inp{background:#0f141c;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .inp input{font-size:15px}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.quick .q{font-size:12px;padding:5px 10px;border-radius:8px;background:#1e2530;color:#b6bfcf}
.btn{background:var(--gold);color:#1a1206;font-weight:600;font-size:14px;border-radius:11px;
  padding:12px;width:100%;text-align:center}
.btn:active{opacity:.85}
.btn.ghost{background:#1e2530;color:var(--txt2);font-weight:400}
.btn-row{display:flex;gap:9px;margin-top:10px}

/* toast */
/* ---- 品种块 ---- */
.items{padding:0 16px}
.blk{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.blk .bh{display:flex;align-items:center;gap:7px;padding:13px 14px}
.blk.mini .bh{padding:12px 14px;cursor:pointer}
.blk.mini:active{background:var(--card2)}
.blk .nm{font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:40%}
.blk .cd{font-size:10px;color:var(--txt3);letter-spacing:.3px}
.blk .sp{flex:1}
.blk .cv{color:#6b7487;font-size:14px;padding-left:3px;line-height:1}
.blk .mtags{display:flex;gap:4px;overflow:hidden;max-width:52%;justify-content:flex-end}
.blk .mtags .tag{white-space:nowrap;flex:none}
.blk .bd{padding:0 14px}
.blk .bf{display:flex;gap:8px;padding:2px 14px 13px}
.blk .save{flex:1;background:rgba(216,166,87,.06);color:var(--gold);font-size:13px;
  font-weight:600;border-radius:10px;padding:9px 0;letter-spacing:.5px;
  border:1px solid rgba(216,166,87,.3)}
.blk .save:active{background:rgba(216,166,87,.18);transform:scale(.99)}
.blk .del{width:56px;background:#1b2130;color:var(--txt3);font-size:12.5px;border-radius:10px}
.blk .del:active{background:#232b3a}
.blk .fd{padding-top:2px}
.blk .fl{display:block;font-size:10.5px;color:#5f6a7d;letter-spacing:.7px;padding:10px 0 0}
.blk textarea.ta{min-height:52px;font-size:13.5px;line-height:1.75;padding:5px 0 2px}
.blk textarea.ta::placeholder,.blk .taginput::placeholder{color:#4d5666}
.addmore{display:block;width:100%;text-align:center;padding:11px 0;margin:2px 0 10px;
  border:1px dashed rgba(255,255,255,.12);border-radius:11px;font-size:12.5px;color:#6f7889}
.addmore:active{background:#161b24;color:var(--gold)}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;letter-spacing:.2px;flex:none}
.badge.plan{background:rgba(216,166,87,.14);color:var(--gold)}
.badge.extra{background:rgba(91,157,255,.14);color:var(--blue)}
.src{font-size:9.5px;color:var(--txt3);background:#1b2130;border-radius:4px;padding:1px 4px;margin-right:6px;vertical-align:1px}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translate(-50%,14px);
  background:rgba(40,46,58,.96);color:#e8ecf3;font-size:12.5px;padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.22s;z-index:90;white-space:nowrap;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 设置 */
.setrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border:0}
.setrow .v{font-size:12px;color:var(--txt3)}
.danger{color:var(--red)}

/* 搜索 */
.searchbar{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 16px 12px}
.searchbar .box{flex:1;background:var(--card);border-radius:12px;padding:10px 13px;display:flex;
  align-items:center;gap:8px}
.searchbar input{font-size:14px}
.res{padding:0 16px}
.res .hit{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.res .hit .d{font-size:11px;color:var(--gold);margin-bottom:3px}
.res .hit .t{font-size:12.5px;color:var(--txt2);line-height:1.6}
.res mark{background:rgba(216,166,87,.25);color:var(--gold);border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 日历 ============ -->
  <section class="view on" id="vCal">
    <div class="hdr">
      <div class="brand">交易日志<small>因果，不是盈亏</small></div>
      <div class="acts">
        <button class="ico" id="btnToday" title="写今天">✎</button>
        <button class="ico" id="btnSearch">⌕</button>
        <button class="ico" id="btnSetting">⋯</button>
      </div>
    </div>
    <div class="monbar">
      <button id="prevM">‹</button>
      <div class="m" id="monLabel">—</div>
      <button id="nextM">›</button>
    </div>
    <div class="statline" id="statLine"></div>
    <div class="wkhead"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="grid" id="calGrid"></div>
    <div class="listhead"><span id="listTitle">本月记录</span><span id="listCount"></span></div>
    <div id="calList"></div>
  </section>

  <!-- ============ 单日 ============ -->
  <section class="view" id="vDay">
    <div class="daybar">
      <button class="back" id="btnBack">‹</button>
      <div class="mid"><div class="dt" id="dayTitle">—</div><div class="sub" id="daySub"></div></div>
      <button class="back" id="btnDayMore" style="font-size:16px">⋯</button>
    </div>
    <div class="seg">
      <button id="segPre" class="pre">盘前计划</button>
      <button id="segPost">收盘复盘</button>
    </div>

    <!-- 盘前 -->
    <div class="pane on" id="panePre">
      <div class="items" id="preItems"></div>
      <div class="savebar" id="preSaved"></div>
    </div>

    <!-- 复盘 -->
    <div class="pane" id="panePost">
      <div class="items" id="postItems"></div>
      <div class="savebar" id="postSaved"></div>
    </div>
  </section>

  <!-- ============ 搜索 ============ -->
  <section class="view" id="vSearch">
    <div class="searchbar">
      <div class="box"><span style="color:var(--txt3)">⌕</span><input id="qInput" placeholder="搜文本、品种、标签…"></div>
      <button id="btnQClose" style="font-size:13px;color:var(--txt2)">取消</button>
    </div>
    <div class="res" id="qRes"></div>
  </section>

  <!-- ============ 设置 ============ -->
  <section class="view" id="vSet">
    <div class="daybar">
      <button class="back" id="btnSetBack">‹</button>
      <div class="mid"><div class="dt">设置</div><div class="sub">数据只存本机</div></div>
      <div style="width:38px"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="clabel"><span>数据</span></div>
      <div class="setrow"><span>记录天数</span><span class="v" id="setDays">0</span></div>
      <div class="setrow"><span>存储占用</span><span class="v" id="setSize">0 KB</span></div>
      <div class="setrow"><span>上次备份</span><span class="v" id="setBackup">从未</span></div>
    </div>
    <div class="card">
      <div class="clabel"><span>导出 / 备份</span></div>
      <div class="btn-row"><button class="btn ghost" id="btnExportJson">导出 JSON</button>
        <button class="btn ghost" id="btnExportMd">导出 Markdown</button></div>
      <div class="btn-row"><button class="btn ghost" id="btnImport">导入 JSON</button></div>
      <div class="hint" style="margin-top:10px">JSON 是给 AI 用的结构化格式；Markdown 是人看的。建议每两周导出一次。</div>
    </div>
    <div class="card">
      <div class="clabel"><span>危险操作</span></div>
      <div class="setrow"><span class="danger">清空全部数据</span><button class="v danger" id="btnWipe">清空</button></div>
    </div>
    <div class="hint" style="text-align:center;padding:22px 30px 40px">
      交易日志 v1.0 · 离线可用<br>数据存在这台手机的浏览器里，清缓存会丢，记得导出。
    </div>
  </section>
</div>

<div id="mask"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
/* ============================================================
   数据层
   ============================================================ */
const KEY = 'tradelog.v1';
const IS_ANDROID = /Android/i.test(navigator.userAgent);
let DB = { version: 1, days: {}, settings: {} };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) DB = JSON.parse(raw);
  }catch(e){ console.warn('读取失败', e); }
  DB.version = DB.version || 1;
  DB.days = DB.days || {};
  DB.settings = DB.settings || {};
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('存储空间不足，建议导出备份'); }
}

/* ============================================================
   工具
   ============================================================ */
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const pad2 = n => String(n).padStart(2,'0');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ const d=parseD(s); return `${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]}`; }
function fmtDateShort(s){ const d=parseD(s); return `${d.getMonth()+1}/${d.getDate()} ${WD[d.getDay()]}`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nowHM(){ const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

let toastTimer=null;
function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),1800);
}
const $ = id => document.getElementById(id);

/* ============================================================
   单日数据
   ============================================================ */
function newItem(o){
  return Object.assign({id:uid(), name:'', code:'', text:'', market:'', summary:'',
    tags:[], manual:[], hide:[], open:true, at:0}, o||{});
}
function itKey(it){ return ((it.name||'')+'|'+(it.code||'')).trim().toLowerCase(); }
function itBlank(it){ return !((it.name||'').trim() || (it.code||'').trim()); }
function itLabel(it){ return (it.name||it.code||'').trim() || '未分品种'; }
function dayItems(d, pane){ return (d && d[pane] && d[pane].items) || []; }
function findItem(d, pane, id){ return dayItems(d, pane).find(x=>x.id===id); }

function ensureDay(date){
  if(!DB.days[date]) DB.days[date] = {date, pre:{items:[]}, post:{items:[]}};
  const d = DB.days[date];
  d.pre = d.pre || {}; d.post = d.post || {};
  if(!Array.isArray(d.pre.items)) d.pre.items = [];
  if(!Array.isArray(d.post.items)) d.post.items = [];
  if(!Array.isArray(d.post.skip)) d.post.skip = [];
  migrateDay(d);
  return d;
}

/* 旧结构（一天一个文本框 + 品种数组）→ 品种块 */
function migrateDay(d){
  const p = d.pre, q = d.post;
  const pTxt = (p.text||'').trim();
  const pSyms = Array.isArray(p.symbols) ? p.symbols : [];
  if(!p.items.length && (pTxt || pSyms.length)){
    if(pSyms.length){
      pSyms.forEach((x,i)=>p.items.push(newItem({name:x.name||'', code:x.code||'', text:i===0?pTxt:''})));
    }else{
      p.items.push(newItem({text:pTxt}));
    }
  }
  const qM = (q.market||'').trim(), qS = (q.summary||'').trim();
  const qEx = Array.isArray(q.extra) ? q.extra : [];
  if(!q.items.length && (qM || qS || qEx.length)){
    if(qEx.length){
      qEx.forEach((x,i)=>q.items.push(newItem({name:x.name||'', code:x.code||'', market:i===0?qM:'', summary:i===0?qS:''})));
    }else{
      q.items.push(newItem({market:qM, summary:qS}));
    }
  }
  p.text = ''; q.market = ''; q.summary = '';
  p.symbols = []; q.extra = [];
}

/* 复盘页：计划里有的品种自动落一条 */
function syncPost(d){
  const have = new Set(dayItems(d,'post').map(itKey));
  dayItems(d,'pre').forEach(x=>{
    const k = itKey(x);
    if(itBlank(x) || have.has(k) || (d.post.skip||[]).includes(k)) return;
    dayItems(d,'post').push(newItem({name:x.name||'', code:x.code||''}));
    have.add(k);
  });
}
function inPlan(d, it){
  if(itBlank(it)) return false;
  const k = itKey(it);
  return dayItems(d,'pre').some(x=>itKey(x)===k);
}
/* 一天出现过的品种（计划+复盘），去重保序 */
function daySyms(d){
  const out = [], seen = new Set();
  [...dayItems(d,'pre'), ...dayItems(d,'post')].forEach(it=>{
    if(itBlank(it)) return;
    const k = itKey(it);
    if(seen.has(k)) return;
    seen.add(k); out.push({name:it.name||'', code:it.code||''});
  });
  return out;
}
function postSymbols(d){
  return dayItems(d,'post').map(it=>Object.assign({}, it, {src: inPlan(d,it) ? 'plan' : 'extra'}));
}
function dayPreview(d){
  const pre = dayItems(d,'pre').map(x=>(x.text||'').trim()).filter(Boolean);
  const sum = dayItems(d,'post').map(x=>(x.summary||'').trim()).filter(Boolean);
  const mkt = dayItems(d,'post').map(x=>(x.market||'').trim()).filter(Boolean);
  return pre[0] || sum[0] || mkt[0] || '（无正文）';
}
function dayHasContent(d){
  if(!d) return false;
  const has = pane => dayItems(d,pane).some(it=>!itBlank(it) || (it.text||'').trim()
    || (it.market||'').trim() || (it.summary||'').trim());
  return has('pre') || has('post');
}
function preFilled(d){ return !!(d && dayItems(d,'pre').some(x=>!itBlank(x) || (x.text||'').trim())); }
function postFilled(d){ return !!(d && dayItems(d,'post').some(x=>!itBlank(x) || (x.market||'').trim() || (x.summary||'').trim())); }

/* ============================================================
   标签：词典命中 + 品种名 + 手动
   ============================================================ */
const DICT_GROUPS = [
  { max:2, w:['追高','抄底','割肉','止损','止盈','加仓','减仓','清仓','空仓','满仓','重仓','轻仓',
             '扛单','锁仓','对冲','移仓','换月','计划外','按计划','纪律','不追高','破位'] },
  { max:2, w:['情绪化','犹豫','冲动','恐惧','贪婪','侥幸','后悔','焦虑','自信','恐高','上头'] },
  { max:2, w:['主线','龙头','题材','板块','热点','退潮','发酵','启动','分歧','一致','接力','首板','连板','补涨','补跌'] },
  { max:2, w:['缩量','放量','平量','普涨','普跌','分化','轮动','跳水','震荡','单边','突破','假突破',
             '缺口','支撑','压力','新低','新高','冲高回落','低开高走','高开低走','赚钱效应','亏钱效应',
             '量能不足','成交额','情绪冰点','尾盘','午盘'] },
  { max:1, w:['基差','升水','贴水','展期','保证金','隔夜','夜盘','期现','逼仓','主力合约','远月','近月','移仓换月'] },
];

function autoTags(text){
  const src = String(text||'');
  if(!src) return [];
  let t = src;
  const hits = [];
  DICT_GROUPS.forEach((g, gi)=>{
    [...g.w].sort((a,b)=>b.length-a.length).forEach(w=>{
      if(t.includes(w)){ hits.push({w, gi, pos: src.indexOf(w)}); t = t.split(w).join('　'); }
    });
  });
  hits.sort((a,b)=> a.gi - b.gi || a.pos - b.pos);
  const cnt = {}, out = [];
  for(const h of hits){
    cnt[h.gi] = (cnt[h.gi]||0) + 1;
    if(cnt[h.gi] > 3) continue;
    if(out.includes(h.w)) continue;
    out.push(h.w);
    if(out.length >= 8) break;
  }
  return out;
}
/* 单条品种的标签：手动 + 正文自动 */
function itemTags(it){
  const text = [(it.text||''), (it.market||''), (it.summary||'')].join(' ');
  const hide = it.hide || [], manual = it.manual || [];
  const all = [...manual, ...autoTags(text)];
  const out = [];
  all.forEach(t=>{ if(t && !hide.includes(t) && !out.includes(t)) out.push(t); });
  return out.slice(0,8);
}
/* 整页标签：所有品种合并（供日历/搜索/导出用） */
function computeTags(day, pane){
  const out = [];
  dayItems(day, pane).forEach(it=>{
    itemTags(it).forEach(t=>{ if(!out.includes(t)) out.push(t); });
  });
  if(day && day[pane]) day[pane].tags = out;
  return out;
}

/* ============================================================
   日历
   ============================================================ */
function renderCal(){
  const [y,m] = calYM.split('-').map(Number);
  $('monLabel').textContent = `${y}年${m}月`;

  const first = new Date(y, m-1, 1);
  const offset = (first.getDay()+6)%7;      // 周一为第一列
  const days = new Date(y, m, 0).getDate();
  const today = todayStr();

  let html = '';
  for(let i=0;i<offset;i++) html += '<div class="cell pad"></div>';
  for(let d=1; d<=days; d++){
    const ds = `${y}-${pad2(m)}-${pad2(d)}`;
    const day = DB.days[ds];
    const has = dayHasContent(day);
    const cls = ['cell'];
    if(has) cls.push('has');
    if(ds===today) cls.push('today');
    let dots = '';
    if(has){
      const a = preFilled(day) ? '<i class="d-pre"></i>' : '';
      const b = postFilled(day) ? '<i class="d-post"></i>' : '';
      dots = `<div class="dots">${a}${b}</div>`;
    }else{
      dots = '<div class="dots"></div>';
    }
    html += `<div class="${cls.join(' ')}" data-d="${ds}"><span class="n">${d}</span>${dots}</div>`;
  }
  const total = offset + days;
  const tail = (7 - total%7)%7;
  for(let i=0;i<tail;i++) html += '<div class="cell pad"></div>';
  $('calGrid').innerHTML = html;

  // 统计
  const list = monthDays(calYM);
  const preN = list.filter(d=>preFilled(DB.days[d])).length;
  const postN = list.filter(d=>postFilled(DB.days[d])).length;
  const streak = calcStreak();
  $('statLine').innerHTML = `本月 <b>${list.length}</b> 天有记录　盘前 ${preN} · 复盘 ${postN}　连续 <b>${streak}</b> 天`;

  // 列表
  $('listCount').textContent = list.length ? `${list.length} 天` : '';
  if(!list.length){
    $('calList').innerHTML = `<div class="empty"><span class="big">○</span>这个月还没有记录<br>
      <button class="tag" style="margin-top:12px;color:var(--gold);background:var(--gold-d);padding:6px 16px" onclick="openDay(todayStr())">写今天的记录</button></div>`;
  }else{
    $('calList').innerHTML = list.slice().reverse().map(ds=>{
      const d = DB.days[ds];
      const tags = (computeTags(d,'pre').concat(computeTags(d,'post'))).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
      const syms = daySyms(d).map(x=>x.name||x.code).filter(Boolean).slice(0,3).join(' · ');
      const preview = dayPreview(d);
      return `<div class="entry" data-d="${ds}">
        <div class="e-top"><span class="e-date">${fmtDateShort(ds)}</span>
          <span class="e-syms">${esc(syms)}</span></div>
        <div class="e-txt">${esc(preview)}</div>
        ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      </div>`;
    }).join('');
  }
}
function monthDays(ym){
  return Object.keys(DB.days).filter(d=>d.startsWith(ym) && dayHasContent(DB.days[d])).sort();
}
function calcStreak(){
  // 从今天（或最近有记录的一天）往前数连续记录天数
  let n=0, d=new Date();
  for(let i=0;i<400;i++){
    const s = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    if(dayHasContent(DB.days[s])) n++;
    else if(i>0) break;      // 今天没写不算断，昨天开始算
    d.setDate(d.getDate()-1);
  }
  return n;
}

/* ============================================================
   单日详情
   ============================================================ */
function openDay(date, pane, push){
  curDate = date;
  const d = ensureDay(date);
  $('dayTitle').textContent = fmtDate(date);
  const isToday = date === todayStr();
  const diff = Math.round((parseD(todayStr()) - parseD(date))/86400000);
  $('daySub').textContent = isToday ? '今天' : (diff===1?'昨天':(diff>1?`${diff} 天前`:''));

  // 默认分段
  if(!pane){
    if(isToday){
      pane = new Date().getHours() >= 15 ? 'post' : 'pre';
    }else{
      pane = postFilled(d) ? 'post' : 'pre';
    }
    if(preFilled(d) && !postFilled(d)) pane = 'pre';
  }
  setPane(pane);

  renderItems('pre'); renderItems('post');
  updateSavedLabel('pre'); updateSavedLabel('post');

  $('btnBack').onclick = goCal;
  show('vDay');
  if(push===false) history.replaceState({v:'day', date}, '', '#/d/'+date);
  else history.pushState({v:'day', date}, '', '#/d/'+date);
}
function setPane(p){
  curPane = p;
  $('panePre').classList.toggle('on', p==='pre');
  $('panePost').classList.toggle('on', p==='post');
  $('segPre').className = 'pre' + (p==='pre' ? ' on' : '');
  $('segPost').className = 'post' + (p==='post' ? ' on' : '');
  if(p==='post') renderItems('post');   // 补上计划里新增的品种
}
function goCal(){
  renderCal();
  show('vCal');
  history.replaceState({v:'cal'}, '', '#/');
}

/* ============================================================
   品种块渲染
   ============================================================ */
function tagsHtml(pane, it, tags){
  return tags.map(t=>`<span class="tag on">${esc(t)}<span class="del" data-deltag="${pane}:${it.id}" data-t="${esc(t)}">×</span></span>`).join('')
    + `<button class="tag" data-addtag="${pane}:${it.id}" style="color:var(--txt3)">＋ 标签</button>
       <input class="taginput" id="ti_${it.id}" placeholder="输入标签" maxlength="8">`;
}

function itemHtml(pane, d, it){
  const label = itLabel(it);
  const tags = itemTags(it);
  let badge = '';
  if(pane==='post' && !itBlank(it)){
    badge = inPlan(d, it) ? '<span class="badge plan">计划</span>' : '<span class="badge extra">计划外</span>';
  }
  const head = `<div class="bh">
      <span class="nm">${esc(label)}</span>
      ${it.code && it.name ? `<span class="cd">${esc(it.code)}</span>` : ''}
      ${badge}<span class="sp"></span>
      <span class="mtags">${tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span>
      ${it.open ? '' : '<span class="cv">⌄</span>'}
    </div>`;

  if(!it.open) return `<div class="blk mini" data-fold="${pane}:${it.id}">${head}</div>`;

  const body = pane==='pre'
    ? `<div class="fd"><span class="fl">今日计划</span>
         <textarea class="ta" data-f="text" data-id="${it.id}" placeholder="这个品种今天准备怎么做？&#10;例：回踩 4100 不破开多 1 手，跌破 4080 止损。">${esc(it.text||'')}</textarea></div>`
    : `<div class="fd"><span class="fl">市场复盘</span>
         <textarea class="ta" data-f="market" data-id="${it.id}" placeholder="这个品种今天怎么走的？&#10;开盘、量能、关键价位、有没有诱多。">${esc(it.market||'')}</textarea></div>
       <div class="fd"><span class="fl">操作总结</span>
         <textarea class="ta" data-f="summary" data-id="${it.id}" placeholder="我做了什么，对在哪、错在哪。&#10;按计划了吗？没按是为什么。">${esc(it.summary||'')}</textarea></div>`;

  return `<div class="blk">
      ${head}
      <div class="bd">${body}</div>
      <div class="tagrow" id="tg_${it.id}" style="padding:0 14px 9px">${tagsHtml(pane, it, tags)}</div>
      <div class="bf">
        <button class="save" data-save="${pane}:${it.id}">保存</button>
        <button class="del" data-delitem="${pane}:${it.id}">删除</button>
      </div>
    </div>`;
}

function renderItems(pane){
  const d = ensureDay(curDate);
  if(pane==='post') syncPost(d);
  const box = pane==='pre' ? $('preItems') : $('postItems');
  const list = dayItems(d, pane);
  if(!list.length){
    box.innerHTML = `<div class="empty" style="padding:36px 22px">
        <span class="big">＋</span>
        ${pane==='pre' ? '先加一个今天要看的品种' : '计划里的品种会自动出现在这里'}
        <br><button class="btn" style="margin-top:16px;padding:9px 22px;font-size:13px" data-add="${pane}">添加品种</button>
      </div>`;
    return;
  }
  box.innerHTML = list.map(it=>itemHtml(pane, d, it)).join('')
    + `<button class="addmore" data-add="${pane}">＋ 添加品种</button>`;
  box.querySelectorAll('textarea.ta').forEach(grow);
}

function renderTagIn(pane, it, force){
  const el = $('tg_'+it.id);
  if(!el) return;
  const ae = document.activeElement;
  if(!force && ae && ae.id === 'ti_'+it.id) return;   // 正在输入标签，别动
  el.innerHTML = tagsHtml(pane, it, itemTags(it));
}

/* ============================================================
   保存（防抖）
   ============================================================ */
const timers = {};
function scheduleSave(pane, it){
  const d = ensureDay(curDate);
  d[pane].at = Date.now();
  if(it) it.at = Date.now();
  const bar = pane==='pre' ? $('preSaved') : $('postSaved');
  bar.textContent = '保存中…';
  bar.classList.add('act');
  clearTimeout(timers[pane]);
  timers[pane] = setTimeout(()=>{
    if(it) it.tags = itemTags(it);
    d[pane].tags = computeTags(d, pane);
    persist();
    updateSavedLabel(pane);
  }, 400);

  if(it){
    clearTimeout(timers[pane+'_'+it.id]);
    timers[pane+'_'+it.id] = setTimeout(()=>renderTagIn(pane, it), 900);
  }
}

/* 保存 = 收起成一行 */
function saveItem(pane, id){
  const d = ensureDay(curDate);
  const it = findItem(d, pane, id);
  if(!it) return;
  clearTimeout(timers[pane]);
  clearTimeout(timers[pane+'_'+id]);
  it.tags = itemTags(it);
  it.open = false;
  d[pane].at = Date.now();
  d[pane].tags = computeTags(d, pane);
  persist();
  renderItems(pane);
  updateSavedLabel(pane);
  toast((itBlank(it) ? '已收起' : itLabel(it) + ' 已保存'));
}

function updateSavedLabel(pane){
  const d = ensureDay(curDate);
  const at = d[pane] && d[pane].at;
  const bar = pane==='pre' ? $('preSaved') : $('postSaved');
  bar.classList.remove('act');
  if(!at){ bar.textContent = '边写边存 · 写完点保存收成一行'; return; }
  const dt = new Date(at);
  bar.textContent = `已保存 ${pad2(dt.getHours())}:${pad2(dt.getMinutes())}`;
}

   文本域
   ============================================================ */
function grow(el){
  const min = el.classList.contains('ta') ? 52 : 104;
  el.style.height = 'auto';
  el.style.height = Math.max(min, el.scrollHeight) + 'px';
}

/* ============================================================
   品种添加
   ============================================================ */
function parseSymbol(str){
  let s = String(str||'').trim().replace(/\s+/g,' ');
  if(!s) return null;
  // "沪深300ETF 510300" / "IF2512,if" 形式
  const m = s.match(/^(.+?)[\s,，]+([A-Za-z0-9]{2,12})$/);
  if(m) return {id:uid(), name:m[1].trim(), code:m[2].toUpperCase()};
  // 纯代码
  if(/^[A-Za-z]{1,3}\d{3,4}$/.test(s) || /^\d{6}$/.test(s)) return {id:uid(), name:s.toUpperCase(), code:''};
  return {id:uid(), name:s, code:''};
}
function freqSymbols(){
  const map = new Map();
  Object.values(DB.days).forEach(d=>{
    [...dayItems(d,'pre'), ...dayItems(d,'post')].forEach(s=>{
      const k = (s.name||s.code||'').trim();
      if(!k) return;
      const cur = map.get(k) || {name:s.name, code:s.code, n:0};
      cur.n++; map.set(k, cur);
    });
  });
  return [...map.values()].sort((a,b)=>b.n-a.n).slice(0,8);
}
function openAddSym(pane){
  const quick = freqSymbols();
  const d = ensureDay(curDate);
  const existing = dayItems(d, pane).filter(x=>!itBlank(x));

  const sheet = $('sheet');
  sheet.innerHTML = `
    <h3>添加品种</h3>
    <div class="sub">期货填合约，如 IF2512、CU2601；ETF 可填 510300 或「沪深300ETF 510300」</div>
    <div class="inp"><input id="symInput" placeholder="输入名称或代码" autocomplete="off" autocapitalize="characters"></div>
    ${quick.length?`<div class="clabel" style="margin:4px 0 8px">常用</div>
      <div class="quick" id="symQuick">${quick.map(q=>`<button class="q" data-sym="${esc(q.name||q.code)}" data-code="${esc(q.code||'')}">${esc(q.name||q.code)}</button>`).join('')}</div>`:''}
    <div class="btn-row"><button class="btn" id="symOk">添加</button>
      <button class="btn ghost" id="symCancel">取消</button></div>`;
  openSheet();

  const input = $('symInput');
  setTimeout(()=>input.focus(), 120);
  const add = (raw)=>{
    const sym = parseSymbol(raw);
    if(!sym) return;
    const key = itKey(sym);
    if(existing.some(x=>itKey(x)===key)){ toast('已经加过了'); return; }
    if(pane==='post') d.post.skip = (d.post.skip||[]).filter(k=>k!==key);
    const it = newItem({name:sym.name||'', code:sym.code||'', open:true});
    dayItems(d, pane).push(it);
    d[pane].at = Date.now();
    closeSheet();
    renderItems(pane);
    updateSavedLabel(pane);
    persist();
    setTimeout(()=>{
      const box = pane==='pre' ? $('preItems') : $('postItems');
      const ta = box.querySelector(`textarea[data-id="${it.id}"]`);
      if(ta){ ta.scrollIntoView({block:'center', behavior:'smooth'}); ta.focus(); }
    }, 90);
  };
  $('symOk').onclick = ()=>add(input.value);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(input.value); } });
  $('symCancel').onclick = closeSheet;
  sheet.querySelectorAll('#symQuick .q').forEach(b=>{
    b.onclick = ()=>add(b.dataset.code ? `${b.dataset.sym} ${b.dataset.code}` : b.dataset.sym);
  });
}

/* ============================================================
   事件绑定
   ============================================================ */
function bindEvents(){
  // 日历
  $('prevM').onclick = ()=>{ shiftMonth(-1); };
  $('nextM').onclick = ()=>{ shiftMonth(1); };
  $('calGrid').onclick = e=>{
    const c = e.target.closest('.cell[data-d]');
    if(c) openDay(c.dataset.d);
  };
  $('calList').onclick = e=>{
    const c = e.target.closest('.entry[data-d]');
    if(c) openDay(c.dataset.d);
  };

  // 分段
  $('segPre').onclick = ()=>setPane('pre');
  $('segPost').onclick = ()=>setPane('post');

  // 文本框（品种块内，动态渲染，走委托）
  document.addEventListener('input', e=>{
    const ta = e.target.closest('textarea.ta[data-id]');
    if(!ta) return;
    const pane = ta.closest('#panePre') ? 'pre' : 'post';
    const d = ensureDay(curDate);
    const it = findItem(d, pane, ta.dataset.id);
    if(!it) return;
    it[ta.dataset.f] = ta.value;
    grow(ta);
    scheduleSave(pane, it);
  });

  // 品种块操作
  document.addEventListener('click', e=>{
    const add = e.target.closest('[data-add]');
    if(add){ openAddSym(add.dataset.add); return; }

    const fold = e.target.closest('[data-fold]');
    if(fold){
      const [pane, id] = fold.dataset.fold.split(':');
      const it = findItem(ensureDay(curDate), pane, id);
      if(it){
        it.open = true; persist(); renderItems(pane);
        setTimeout(()=>{
          const box = pane==='pre' ? $('preItems') : $('postItems');
          const ta = box.querySelector(`textarea[data-id="${id}"]`);
          if(ta) ta.focus();
        }, 60);
      }
      return;
    }

    const sv = e.target.closest('[data-save]');
    if(sv){ const [pane, id] = sv.dataset.save.split(':'); saveItem(pane, id); return; }

    const delItem = e.target.closest('[data-delitem]');
    if(delItem){
      const [pane, id] = delItem.dataset.delitem.split(':');
      const d = ensureDay(curDate);
      const it = findItem(d, pane, id);
      if(!it) return;
      const has = ((it.text||'')+(it.market||'')+(it.summary||'')).trim();
      if(has && !confirm(`删除「${itLabel(it)}」这一条？`)) return;
      const key = itKey(it);
      if(pane==='post' && inPlan(d, it)){
        // 计划里有的品种，复盘里删掉 = 今天不看，别再自动同步回来
        d.post.skip = [...new Set([...(d.post.skip||[]), key])];
      }
      d[pane].items = dayItems(d, pane).filter(x=>x.id!==id);
      if(pane==='pre'){
        // 计划删了，复盘里那条空的也一起走
        d.post.items = dayItems(d,'post').filter(x=>{
          if(itKey(x)!==key) return true;
          return !!(((x.market||'')+(x.summary||'')).trim());
        });
      }
      d[pane].at = Date.now();
      d[pane].tags = computeTags(d, pane);
      persist(); renderItems(pane); updateSavedLabel(pane);
      toast('已删除');
      return;
    }

    const delTag = e.target.closest('[data-deltag]');
    if(delTag){
      const [pane, id] = delTag.dataset.deltag.split(':');
      const d = ensureDay(curDate);
      const it = findItem(d, pane, id);
      if(!it) return;
      it.hide = [...new Set([...(it.hide||[]), delTag.dataset.t])];
      persist(); renderTagIn(pane, it);
      return;
    }

    const addTag = e.target.closest('[data-addtag]');
    if(addTag){
      const [pane, id] = addTag.dataset.addtag.split(':');
      const inp = $('ti_'+id);
      if(!inp) return;
      inp.classList.add('on'); inp.focus();
      inp.onkeydown = ev=>{
        if(ev.key==='Enter'){
          const v = inp.value.trim();
          if(v){
            const d = ensureDay(curDate);
            const it = findItem(d, pane, id);
            it.manual = [...new Set([...(it.manual||[]), v])];
            it.hide = (it.hide||[]).filter(x=>x!==v);
            inp.value = ''; inp.classList.remove('on'); inp.blur();
            it.tags = itemTags(it);
            persist(); renderTagIn(pane, it, true);
          }
        }
        if(ev.key==='Escape') inp.classList.remove('on');
      };
      inp.onblur = ()=>setTimeout(()=>inp.classList.remove('on'), 150);
      return;
    }
  });

  // 返回
  $('btnBack').onclick = goCal;

  // 搜索
  $('btnToday').onclick = ()=>openDay(todayStr());
  $('btnSearch').onclick = ()=>{ show('vSearch'); history.pushState({v:'search'}, '', '#/search'); setTimeout(()=>$('qInput').focus(),100); };
  $('btnQClose').onclick = ()=>{ $('qInput').value=''; show('vCal'); };
  $('qInput').addEventListener('input', e=>renderSearch(e.target.value.trim()));

  // 设置
  $('btnSetting').onclick = ()=>{ renderSetting(); show('vSet'); history.pushState({v:'set'}, '', '#/set'); };
  $('btnSetBack').onclick = ()=>show('vCal');
  $('btnExportJson').onclick = exportJson;
  $('btnExportMd').onclick = exportMd;
  $('btnImport').onclick = ()=>$('fileIn').click();
  $('fileIn').onchange = importJson;
  $('btnWipe').onclick = wipe;

  $('mask').onclick = closeSheet;

  // 返回键
  window.addEventListener('popstate', ()=>{
    if(curView==='vDay' || curView==='vSet' || curView==='vSearch'){ goCal(); }
  });

  // 左右滑动切日期
  let sx=0, sy=0, moved=false;
  const dayView = $('vDay');
  dayView.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved=false;
  }, {passive:true});
  dayView.addEventListener('touchmove', e=>{
    if(e.touches.length!==1) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.6) moved = true;
  }, {passive:true});
  dayView.addEventListener('touchend', e=>{
    if(!moved) return;
    const dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx)<70) return;
    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const d = parseD(curDate);
    d.setDate(d.getDate() + (dx<0 ? 1 : -1));
    const s = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    openDay(s, curPane, false);
  });
}
function shiftMonth(delta){
  const [y,m] = calYM.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  calYM = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  renderCal();
}

/* ============================================================
   搜索
   ============================================================ */
function renderSearch(q){
  const box = $('qRes');
  if(!q){
    box.innerHTML = `<div class="empty"><span class="big">⌕</span>搜品种、标签、任何一句话<br>比如「追高」「IF」「缩量」</div>`;
    return;
  }
  const ql = q.toLowerCase();
  const hits = [];
  Object.keys(DB.days).sort().reverse().forEach(ds=>{
    const d = DB.days[ds];
    if(!dayHasContent(d)) return;
    const tags = [...computeTags(d,'pre'), ...computeTags(d,'post')].filter((v,i,a)=>a.indexOf(v)===i);
    const symList = daySyms(d).map(x=>x.name||x.code);
    const segs = [];
    dayItems(d,'pre').forEach(it=>{
      const t = (it.text||'').trim();
      if(t) segs.push({k:'盘前'+(itBlank(it)?'' : ' · '+itLabel(it)), t});
    });
    dayItems(d,'post').forEach(it=>{
      const mk = (it.market||'').trim(), sm = (it.summary||'').trim();
      const base = '复盘'+(itBlank(it)?'' : ' · '+itLabel(it));
      if(mk) segs.push({k:base, t:mk});
      if(sm) segs.push({k:base+' 总结', t:sm});
    });
    const all = [segs.map(x=>x.t).join(' '), tags.join(' '), symList.join(' ')].join(' ');
    if(!all.toLowerCase().includes(ql)) return;
    const matched = segs.filter(x=>x.t.toLowerCase().includes(ql));
    hits.push({ds, tags, syms:symList.join(' '), segs: matched.length?matched:segs.slice(0,1)});
  });
  if(!hits.length){ box.innerHTML = `<div class="empty"><span class="big">·</span>没找到「${esc(q)}」</div>`; return; }

  const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  box.innerHTML = hits.slice(0,60).map(h=>{
    const body = h.segs.map(sg=>{
      const raw = sg.t.replace(/\s+/g,' ');
      const i = raw.toLowerCase().indexOf(ql);
      let snip;
      if(i>=0){
        const a = Math.max(0,i-24), b = Math.min(raw.length, i+q.length+54);
        snip = (a>0?'…':'') + raw.slice(a,b) + (b<raw.length?'…':'');
      }else{ snip = raw.slice(0,72)+(raw.length>72?'…':''); }
      const hl = esc(snip).replace(new RegExp(safeQ,'gi'), m=>`<mark>${m}</mark>`);
      return `<div class="t" style="margin-bottom:5px"><span class="src">${sg.k}</span>${hl}</div>`;
    }).join('');
    return `<div class="hit" data-d="${h.ds}">
      <div class="d">${fmtDateShort(h.ds)}${h.syms?' · '+esc(h.syms).slice(0,38):''}</div>
      ${body}
      ${h.tags.length?`<div class="tags">${h.tags.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    </div>`;
  }).join('');
  box.querySelectorAll('.hit').forEach(el=>{
    el.onclick = ()=>{ $('qInput').value=''; openDay(el.dataset.d); };
  });
}

/* ============================================================
   设置 / 导出 / 导入
   ============================================================ */
function renderSetting(){
  const n = Object.keys(DB.days).filter(d=>dayHasContent(DB.days[d])).length;
  $('setDays').textContent = n + ' 天';
  let bytes=0;
  try{ bytes = new Blob([localStorage.getItem(KEY)||'']).size; }catch(e){}
  $('setSize').textContent = (bytes/1024).toFixed(1) + ' KB';
  const last = DB.settings.lastBackupAt;
  $('setBackup').textContent = last ? timeAgo(last) : '从未';
}
function timeAgo(iso){
  const d = Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(d<=0) return '今天';
  if(d===1) return '昨天';
  return d + ' 天前';
}
function exportPayload(){
  const days = Object.keys(DB.days).sort().filter(d=>dayHasContent(DB.days[d])).map(ds=>{
    const d = DB.days[ds];
    const preItems = dayItems(d,'pre').filter(it=>!itBlank(it) || (it.text||'').trim());
    const postItems = dayItems(d,'post').filter(it=>!itBlank(it) || (it.market||'').trim() || (it.summary||'').trim());
    const preTags = computeTags(d,'pre'), postTags = computeTags(d,'post');
    const joined = (arr, f) => arr.map(it=>`【${itLabel(it)}】${(it[f]||'').trim()}`).filter(x=>x.length>2).join('\n');
    return {
      date: ds,
      pre: {
        items: preItems.map(it=>({symbol:itLabel(it), code:it.code||'', plan:(it.text||'').trim(), tags:itemTags(it)})),
        symbols: preItems.filter(it=>!itBlank(it)).map(it=>({name:it.name||'', code:it.code||''})),
        plan: joined(preItems, 'text'),
        tags: preTags,
      },
      post: {
        items: postItems.map(it=>({symbol:itLabel(it), code:it.code||'', inPlan:inPlan(d,it),
          market:(it.market||'').trim(), summary:(it.summary||'').trim(), tags:itemTags(it)})),
        symbols: postItems.filter(it=>!itBlank(it)).map(it=>({name:it.name||'', code:it.code||'', inPlan:inPlan(d,it)})),
        market: joined(postItems, 'market'),
        summary: joined(postItems, 'summary'),
        tags: postTags,
      },
      tags: [...new Set([...preTags, ...postTags, ...daySyms(d).map(x=>x.code||x.name).filter(Boolean)])],
    };
  });
  return {app:'trade-log', version:2, exportedAt:new Date().toISOString(), days};
}
function download(name, text, mime){
  const blob = new Blob([text], {type:mime||'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  DB.settings.lastBackupAt = new Date().toISOString();
  persist();
  toast('已导出 ' + name);
}
function exportJson(){
  const p = exportPayload();
  download(`交易日志_${todayStr()}.json`, JSON.stringify(p,null,2), 'application/json');
  renderSetting();
}
function exportMd(){
  const p = exportPayload();
  const lines = ['# 交易日志', `导出时间：${new Date().toLocaleString('zh-CN')}`, ''];
  p.days.slice().reverse().forEach(d=>{
    lines.push(`## ${d.date} ${WD[parseD(d.date).getDay()]}`);
    if(d.pre.items.length){
      lines.push('', '### 盘前计划');
      d.pre.items.forEach(it=>{
        lines.push(`**${it.symbol}**${it.tags.length?'　'+it.tags.map(t=>'`#'+t+'`').join(' '):''}`);
        if(it.plan) lines.push('', ...it.plan.split('\n').map(x=>'> '+x));
      });
    }
    if(d.post.items.length){
      lines.push('', '### 收盘复盘');
      d.post.items.forEach(it=>{
        lines.push(`**${it.symbol}**${it.inPlan?'':'（计划外）'}${it.tags.length?'　'+it.tags.map(t=>'`#'+t+'`').join(' '):''}`);
        if(it.market) lines.push('', '市场：', ...it.market.split('\n').map(x=>'> '+x));
        if(it.summary) lines.push('', '操作：', ...it.summary.split('\n').map(x=>'> '+x));
      });
    }
    if(d.tags.length) lines.push('', d.tags.map(t=>`\`#${t}\``).join(' '));
    lines.push('', '---', '');
  });
  download(`交易日志_${todayStr()}.md`, lines.join('\n'), 'text/markdown;charset=utf-8');
  renderSetting();
}
function importJson(e){
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ev=>{
    try{
      const j = JSON.parse(ev.target.result);
      const days = j.days || (j.data && j.data.days);
      if(!Array.isArray(days)) throw new Error('格式不对');
      let n = 0;
      const put = (d, pane, o)=>{
        const list = dayItems(d, pane);
        const key = ((o.name||'')+'|'+(o.code||'')).toLowerCase();
        let it = list.find(x=>itKey(x)===key);
        if(!it){ it = newItem({name:o.name||'', code:o.code||'', open:false}); list.push(it); }
        if(o.text) it.text = o.text;
        if(o.market) it.market = o.market;
        if(o.summary) it.summary = o.summary;
      };
      days.forEach(x=>{
        if(!x.date) return;
        const d = ensureDay(x.date);
        const pre = x.pre || {}, post = x.post || {};
        if(Array.isArray(pre.items) && pre.items.length){
          pre.items.forEach(o=>put(d,'pre',{name:o.symbol||o.name||'', code:o.code||'', text:o.plan||o.text||''}));
        }else{
          const sy = pre.symbols || [];
          if(sy.length) sy.forEach((v,i)=>put(d,'pre',{name:v.name||v.code||'', code:v.code||'', text:i===0?(pre.plan||''):''}));
          else if(pre.plan) put(d,'pre',{text:pre.plan});
        }
        if(Array.isArray(post.items) && post.items.length){
          post.items.forEach(o=>put(d,'post',{name:o.symbol||o.name||'', code:o.code||'', market:o.market||'', summary:o.summary||''}));
        }else{
          const sy = post.symbols || [];
          if(sy.length) sy.forEach((v,i)=>put(d,'post',{name:v.name||v.code||'', code:v.code||'',
            market:i===0?(post.market||''):'', summary:i===0?(post.summary||''):''}));
          else if(post.market || post.summary) put(d,'post',{market:post.market||'', summary:post.summary||''});
        }
        d.pre.tags = computeTags(d,'pre');
        d.post.tags = computeTags(d,'post');
        n++;
      });
      persist(); renderCal(); renderSetting();
      toast(`已导入 ${n} 天`);
    }catch(err){
      toast('导入失败：不是有效的备份文件');
      console.warn(err);
    }
  };
  rd.readAsText(f);
  e.target.value = '';
}
function wipe(){
  if(!confirm('确认清空全部记录？此操作不可恢复，建议先导出备份。')) return;
  if(!confirm('再确认一次：所有盘前计划和复盘都会删除。')) return;
  DB = {version:1, days:{}, settings:{}};
  persist(); renderCal(); renderSetting(); toast('已清空');
}

/* ============================================================
   启动
   ============================================================ */
function init(){
  load();
  bindEvents();
  renderCal();
  show('vCal');

  // PWA
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
  // 深链
  const h = location.hash;
  if(h.startsWith('#/d/')) openDay(h.slice(4));
}
init();
</script>
